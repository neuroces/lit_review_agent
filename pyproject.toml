[project]
name = "lit-review-agent"
version = "0.1.0"
description = "Multi-agent literature review system for Health AI evaluation"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "langgraph>=0.2",
    "langchain-anthropic",
    "pydantic>=2",
    "httpx",
    "python-dotenv",
    "biopython",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "langsmith",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: end-to-end tests with real API calls (deselect with '-m \"not integration\"')",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
